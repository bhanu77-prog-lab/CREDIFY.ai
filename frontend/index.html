    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // .no-transition is added here and removed after one rAF so the body's
      // background/color CSS transition does not animate from the default
      // (unstyled) state into the saved theme on every page load.
      (function () {
        try {
          var saved = localStorage.getItem('scamshield-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        document.documentElement.classList.add('no-transition');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.documentElement.classList.remove('no-transition');
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
